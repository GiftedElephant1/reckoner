# Builds Reckoner on one of GitHub's Macs every time the code changes.
#
# What comes out:
#   Reckoner.ipa         the iPhone app, on the repository's Releases page and attached to the run
#   simulator-check      screenshots and test results from running the app in the iPhone simulator
#
# The .ipa is unsigned on purpose. Sideloadly (or AltStore) signs it with your own Apple ID
# when it installs the app on your iPhone. The README has the steps.

name: Build iPhone app

on:
  push:
    branches: [main, master]
    # changes to the words or to the website alone do not need a new iPhone build
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'dist/manifest.webmanifest'
      - 'dist/sw.js'
      - 'dist/icons/**'
      - 'tools/make_web_icons.py'
      - 'tests/site_test.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: app.reckoner.pocket
  XCODE_APP: /Applications/Xcode_16.4.app

jobs:
  ipa:
    name: Build Reckoner.ipa
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Choose Xcode
        run: |
          if [ -d "$XCODE_APP" ]; then sudo xcode-select -s "$XCODE_APP"; fi
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen || true
          fi
          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "Homebrew did not provide XcodeGen, so its own release is downloaded instead."
            curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
            unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
            echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
          fi

      - name: Assemble the web app from src and check the calculations
        run: |
          python3 tools/build.py
          node tests/run-engine.js
          test -s ios/Reckoner/Web/index.html
          test -s ios/Reckoner/Web/selftest.js

      - name: Create the Xcode project
        working-directory: ios
        run: |
          xcodegen --version
          xcodegen generate

      - name: Build the app
        working-directory: ios
        run: |
          xcodebuild build \
            -quiet \
            -project Reckoner.xcodeproj \
            -scheme Reckoner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package Reckoner.ipa
        run: |
          APP="ios/build/Build/Products/Release-iphoneos/Reckoner.app"
          test -d "$APP"
          test -s "$APP/Info.plist"
          test -s "$APP/Reckoner"
          # the web app must sit in the app as a folder called Web; put it there if the build did not
          if [ ! -s "$APP/Web/index.html" ]; then
            echo "Adding the Web folder to the app by hand."
            rm -rf "$APP/Web"
            cp -R ios/Reckoner/Web "$APP/Web"
          fi
          test -s "$APP/Web/index.html"
          echo "Bundle identifier: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "Version:           $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          echo "Needs iOS:         $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")"
          rm -rf out
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry Reckoner.ipa Payload)
          ls -lh out/Reckoner.ipa

      - name: Attach the .ipa to this run
        uses: actions/upload-artifact@v7
        with:
          name: Reckoner-ipa
          path: out/Reckoner.ipa
          if-no-files-found: error

      - name: Publish it on the Releases page
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: build-${{ github.run_number }}
          TITLE: Reckoner, build ${{ github.run_number }}
        run: |
          NOTES="Download Reckoner.ipa below and install it on your iPhone with Sideloadly; the README has the steps. If you would rather skip that, the README also has the web version, which needs no install."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/Reckoner.ipa --clobber
          else
            gh release create "$TAG" out/Reckoner.ipa --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Say where the app is
        run: |
          {
            echo "## Reckoner.ipa is ready"
            echo
            echo "Download it from the [Releases page]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest): open **Assets** and choose **Reckoner.ipa**."
            echo
            echo "If there is no release, scroll down this page to **Artifacts**, download **Reckoner-ipa** and unzip it."
          } >> "$GITHUB_STEP_SUMMARY"

  # A second look, once the build above has worked: starts the app in the iPhone simulator, runs
  # its built-in checks and takes screenshots. A failure here does not hold back the .ipa.
  simulator-check:
    name: Try it in the iPhone simulator
    needs: ipa
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Choose Xcode
        run: |
          if [ -d "$XCODE_APP" ]; then sudo xcode-select -s "$XCODE_APP"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen || true
          fi
          if ! command -v xcodegen >/dev/null 2>&1; then
            curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
            unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
            echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
          fi

      - name: Assemble the web app from src
        run: python3 tools/build.py

      - name: Create the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodebuild build \
            -quiet \
            -project Reckoner.xcodeproj \
            -scheme Reckoner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Run the app and its self-test
        timeout-minutes: 15
        run: |
          APP="ios/build/Build/Products/Debug-iphonesimulator/Reckoner.app"
          test -d "$APP"
          if [ ! -s "$APP/Web/index.html" ]; then
            rm -rf "$APP/Web"
            cp -R ios/Reckoner/Web "$APP/Web"
          fi
          mkdir -p results
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 ios/ci/pick_simulators.py < "$RUNNER_TEMP/devices.json" > "$RUNNER_TEMP/picks.txt"
          cat "$RUNNER_TEMP/picks.txt"
          test -s "$RUNNER_TEMP/picks.txt"

          while read -r UDID VERSION NAME <&3; do
            LABEL="$(echo "${NAME} iOS ${VERSION}" | tr ' ()' '___')"
            echo "::group::${NAME}, iOS ${VERSION}"
            if xcrun simctl bootstatus "$UDID" -b </dev/null \
              && xcrun simctl install "$UDID" "$APP" </dev/null \
              && xcrun simctl launch "$UDID" "$BUNDLE_ID" -selftest </dev/null; then
              DATA="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data </dev/null || true)"
              for i in $(seq 1 60); do
                if [ -n "$DATA" ] && [ -s "$DATA/Documents/selftest.json" ]; then break; fi
                sleep 2
              done
              sleep 2
              # first with the self-test's own message on screen, then, once it has gone, the app as it is
              xcrun simctl io "$UDID" screenshot "results/${LABEL}-selftest.png" </dev/null || true
              if [ -n "$DATA" ] && [ -s "$DATA/Documents/selftest.json" ]; then
                cp "$DATA/Documents/selftest.json" "results/selftest-${LABEL}.json"
              else
                echo "The app did not report a result on ${NAME} (iOS ${VERSION})."
              fi
              sleep 10
              xcrun simctl io "$UDID" screenshot "results/${LABEL}-light.png" </dev/null || true
              xcrun simctl ui "$UDID" appearance dark </dev/null || true
              sleep 3
              xcrun simctl io "$UDID" screenshot "results/${LABEL}-dark.png" </dev/null || true
            else
              echo "The app could not be started on ${NAME} (iOS ${VERSION})."
            fi
            xcrun simctl shutdown "$UDID" </dev/null || true
            echo "::endgroup::"
          done 3< "$RUNNER_TEMP/picks.txt"
          ls -l results

      - name: Report
        if: always()
        run: python3 ios/ci/selftest_report.py results >> "$GITHUB_STEP_SUMMARY"

      - name: Attach screenshots and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-check
          path: results
          if-no-files-found: warn
