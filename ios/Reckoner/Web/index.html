<title>Reckoner</title>
<style>
/* Layout: one phone-sized column. A ruled sheet of rows scrolls on top; the calculation bar
   and keypad tray stay docked at the bottom. Paper by day, slate by night; results are
   marked with a highlighter, variables are set like variables. */
:root {
  --paper: #EEF2EE;        /* ground behind the sheet, insets, pressed states */
  --sheet: #FFFFFF;        /* the writing surface */
  --ink: #17211D;          /* main text */
  --ink-2: #55625C;        /* secondary text */
  --ink-3: #8A9790;        /* symbols, placeholders, disabled */
  --rule: #DFE6E1;         /* ruled lines */
  --rule-2: #C5CFC9;       /* control outlines */
  --tint: #0B6A57;         /* things you can press, the current selection */
  --tint-ink: #FFFFFF;
  --tint-soft: #E1F0EB;
  --res-bg: #FFE45E;       /* highlighter under a result */
  --res-ink: #1D1900;
  --res-soft: #FFF6C4;
  --neg: #BE2A24;          /* red ink: negative results, deleting */
  --neg-ink: #FFFFFF;
  --negres-bg: #FFD6D0;
  --negres-ink: #971C17;
  --tray: #E3E9E5;         /* keypad tray */
  --key: #FFFFFF;
  --key-2: #CED7D1;
  --key-edge: rgba(23, 33, 29, .18);
  --enter: #FFE45E;
  --enter-ink: #1D1900;
  --scrim: rgba(18, 26, 23, .42);
  --lift: 0 10px 34px rgba(18, 26, 23, .16);
  --toast-act: #FFE45E;    /* the action inside a toast */
  --sat: 0px;              /* safe areas; the native build fills these in */
  --sab: 0px;
  --key-h: 52px;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", Quicksand, Nunito, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-var: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141A17; --sheet: #1D2622; --ink: #ECF1ED; --ink-2: #A9B6AF; --ink-3: #74827B;
    --rule: #2B3632; --rule-2: #3D4A45; --tint: #62D1B5; --tint-ink: #05241C; --tint-soft: #1F3A33;
    --res-bg: rgba(255, 226, 110, .15); --res-ink: #FFE26E; --res-soft: #33392A;
    --neg: #E5574F; --neg-ink: #FFFFFF; --negres-bg: rgba(255, 140, 126, .17); --negres-ink: #FF9D90;
    --tray: #121815; --key: #2A3531; --key-2: #1E2824; --key-edge: rgba(0, 0, 0, .5);
    --enter: #FFE26E; --enter-ink: #1D1900; --scrim: rgba(0, 0, 0, .55); --lift: 0 10px 34px rgba(0, 0, 0, .5); --toast-act: #0A5546;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141A17; --sheet: #1D2622; --ink: #ECF1ED; --ink-2: #A9B6AF; --ink-3: #74827B;
  --rule: #2B3632; --rule-2: #3D4A45; --tint: #62D1B5; --tint-ink: #05241C; --tint-soft: #1F3A33;
  --res-bg: rgba(255, 226, 110, .15); --res-ink: #FFE26E; --res-soft: #33392A;
  --neg: #E5574F; --neg-ink: #FFFFFF; --negres-bg: rgba(255, 140, 126, .17); --negres-ink: #FF9D90;
  --tray: #121815; --key: #2A3531; --key-2: #1E2824; --key-edge: rgba(0, 0, 0, .5);
  --enter: #FFE26E; --enter-ink: #1D1900; --scrim: rgba(0, 0, 0, .55); --lift: 0 10px 34px rgba(0, 0, 0, .5); --toast-act: #0A5546;
  color-scheme: dark;
}
:root.native { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; touch-action: manipulation; }
body {
  margin: 0; overflow: hidden;
  background: var(--sheet); color: var(--ink);
  font: 400 17px/1.3 var(--font-ui);
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body.at-sheet { background: linear-gradient(var(--sheet) 0, var(--sheet) 50%, var(--tray) 50%, var(--tray) 100%); }
button, input, textarea { font: inherit; color: inherit; }
button {
  appearance: none; -webkit-appearance: none; background: none; border: 0; padding: 0; margin: 0;
  cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; text-align: inherit;
}
button:disabled { cursor: default; }
:focus { outline: none; }
:focus-visible { outline: 2.5px solid var(--tint); outline-offset: 2px; border-radius: 8px; }
@supports not selector(:focus-visible) { button:focus { outline: 2.5px solid var(--tint); outline-offset: 2px; } }
svg.ic { width: 24px; height: 24px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; display: block; }

.app {
  position: relative; height: 100%; width: 100%; margin: 0 auto; overflow: hidden; overflow: clip;
  background: var(--sheet); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.screen { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; background: var(--sheet); }

/* On a wide window the app keeps the proportions of a phone */
@media (min-width: 560px) and (min-height: 620px) {
  body, body.at-sheet { background: var(--paper); display: flex; align-items: center; justify-content: center; }
  .app { width: 412px; height: min(100% - 32px, 880px); border-radius: 30px; border: 1px solid var(--rule-2); box-shadow: var(--lift); }
}
@media (max-height: 700px) { :root { --key-h: 46px; } }
@media (max-height: 600px) { :root { --key-h: 40px; } }

/* ------------------------------------------------------------ top bar and titles */
.top { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; min-height: calc(46px + var(--sat)); padding: var(--sat) 6px 0; }
.top .grow { flex: 1 1 auto; }
.tbtn { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; min-width: 44px; padding: 0 8px; border-radius: 12px; color: var(--tint); font-weight: 500; justify-content: center; }
.tbtn.strong { font-weight: 600; }
.tbtn.danger { color: var(--neg); }
.tbtn:active { background: var(--paper); }
.tbtn .lbl { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.head { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 0 16px 10px; border-bottom: 1px solid var(--ink); }
.head .title { flex: 1 1 auto; min-width: 0; margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -.02em; overflow-wrap: anywhere; text-align: left; }
.head .title.small { font-size: 23px; line-height: 29px; }
.head .badge { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 12px; background: var(--paper); display: grid; place-items: center; font-size: 23px; line-height: 1; color: var(--ink-2); }

.head .title, .row .desc, .peek .f, .expr { word-break: break-word; }

/* ------------------------------------------------------------ home list */
.list { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.item { position: relative; border-bottom: 1px solid var(--rule); overflow: hidden; }
.item-main { position: relative; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; background: var(--sheet); touch-action: pan-y; width: 100%; cursor: pointer; }
.item .ico { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 11px; background: var(--paper); display: grid; place-items: center; font-size: 21px; line-height: 1; color: var(--ink-2); }
.item .ico.folder { color: var(--tint); background: var(--tint-soft); }
.item .name { flex: 1 1 auto; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sub { display: block; font-weight: 400; font-size: 13.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta { flex: 0 0 auto; max-width: 44%; color: var(--ink-2); font: 600 16px/1.2 var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .chev { flex: 0 0 auto; color: var(--ink-3); }
.item .chev svg { width: 18px; height: 18px; }
.empty { padding: 44px 28px; text-align: center; color: var(--ink-2); }
.empty b { display: block; color: var(--ink); font-size: 19px; margin-bottom: 6px; }
.homebar { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 8px 10px calc(8px + var(--sab)); border-top: 1px solid var(--rule); }
.homebar .grow { flex: 1 1 auto; }
.cta { display: inline-flex; align-items: center; gap: 6px; height: 46px; padding: 0 20px 0 14px; border-radius: 23px; background: var(--ink); color: var(--sheet); font-weight: 600; }
.cta:active { opacity: .85; }

/* ------------------------------------------------------------ rows of a sheet */
.fields-wrap { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.fields { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: 28px; }
.note { display: flex; align-items: center; gap: 8px; margin: 10px 12px 2px; padding: 9px 6px 9px 12px; border-radius: 12px; background: var(--res-soft); color: var(--ink); font-size: 15px; line-height: 1.3; }
.note span { flex: 1 1 auto; }
.note.install { background: var(--tint-soft); }
.note.install .chip { flex: 0 0 auto; margin-right: 2px; }
.note button { flex: 0 0 auto; width: 36px; height: 36px; display: grid; place-items: center; color: var(--ink-2); border-radius: 10px; }
.note button svg { width: 18px; height: 18px; }
.row { position: relative; border-bottom: 1px solid var(--rule); overflow: hidden; }
.row-main { position: relative; display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 9px 16px; background: var(--sheet); touch-action: pan-y; cursor: pointer; }
.sliding { transition: transform .2s cubic-bezier(.2, .8, .2, 1); }
.row .sym { flex: 0 0 auto; min-width: 20px; max-width: 76px; overflow: hidden; text-overflow: ellipsis; font: italic 400 18px/1.2 var(--font-var); color: var(--ink-3); }
.row .desc { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; line-height: 1.25; }
.row .desc.ghost { color: var(--ink-3); font: italic 400 17px/1.25 var(--font-var); }
.row .val { flex: 0 0 auto; max-width: 66%; display: flex; align-items: baseline; justify-content: flex-end; gap: 5px; font: 600 20px/1.25 var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .val.long { font-size: 17px; }
.row .val.xlong { font-size: 14.5px; }
.row .pre, .row .suf { font-size: .8em; font-weight: 500; color: var(--ink-2); }
.row .num { position: relative; z-index: 0; padding: 0 2px 1px; border-bottom: 2px dotted var(--rule-2); }
.row .num.blank { min-width: 52px; min-height: 1.25em; display: inline-block; }
.row.out .num { border-bottom: 0; padding: 1px 7px; font-weight: 700; color: var(--res-ink); }
.row.out .num::before { content: ""; position: absolute; z-index: -1; top: 0; right: -1px; bottom: 0; left: -1px; background: var(--res-bg); border-radius: 8px 3px 7px 4px / 4px 8px 4px 9px; transform: rotate(-.8deg); }
.row.out.neg .num { color: var(--negres-ink); }
.row.out.neg .num::before { background: var(--negres-bg); }
.row.out.wait .num { color: var(--ink-3); font-weight: 600; }
.row.out.wait .num::before { background: transparent; }
.row.out.err .num { color: var(--neg); }
.row.out.err .num::before { background: var(--negres-bg); }
.row.sel .row-main { background: var(--tint-soft); }
.row.in.sel .num { border-bottom-color: transparent; background: var(--tint); color: var(--tint-ink); border-radius: 999px; padding: 2px 11px 3px; }
.row.in.sel .num.blank::after { content: ""; display: inline-block; width: 2px; height: 1em; background: var(--tint-ink); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
.row.flash .row-main { animation: flash .9s ease-out; }
.peek { position: relative; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 0 16px 11px 46px; background: var(--tint-soft); color: var(--ink-2); font: italic 400 17px/1.3 var(--font-var); }
.nosym .peek { padding-left: 16px; }
.peek .f { flex: 1 1 auto; min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
.peek .acts { flex: 0 0 auto; display: flex; gap: 8px; margin-left: auto; }
.peek .why { font: 400 15px/1.3 var(--font-ui); color: var(--neg); }
.peek .exact { font: 500 14.5px/1.3 var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px; min-height: 34px; padding: 0 13px; border-radius: 17px; border: 1.5px solid var(--tint); color: var(--tint); font: 600 15px/1 var(--font-ui); background: transparent; }
.chip:active { background: var(--tint); color: var(--tint-ink); }
.chip.solid { background: var(--tint); color: var(--tint-ink); }
.chip.plain { border-color: var(--rule-2); color: var(--ink); }
.chip svg { width: 18px; height: 18px; }
.row-del, .item-del { position: absolute; top: 0; right: 0; bottom: 0; width: 96px; background: var(--neg); color: var(--neg-ink); font-weight: 600; text-align: center; visibility: hidden; }
.reveal > .row-del, .reveal > .item-del { visibility: visible; }
.pick { flex: 0 0 auto; color: var(--rule-2); margin-left: -4px; }
.picked .pick { color: var(--tint); }
.grip { flex: 0 0 auto; width: 44px; height: 44px; margin-right: -10px; display: grid; place-items: center; color: var(--ink-3); touch-action: none; cursor: grab; }
.dragging { z-index: 5; }
.dragging .row-main, .dragging .item-main { box-shadow: var(--lift); background: var(--sheet); }
.linking .row .row-main { cursor: pointer; }
.linking .row.nolink { opacity: .35; }
.scrim { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: var(--scrim); z-index: 2; animation: fade .18s ease-out; }

/* ------------------------------------------------------------ dock: entry, bar, keypad */
.dock { flex: 0 0 auto; position: relative; z-index: 3; background: var(--tray); }
.entry { position: relative; background: var(--sheet); border-radius: 20px 20px 0 0; margin-top: -20px; padding: 16px 16px 8px; box-shadow: 0 -10px 30px rgba(18, 26, 23, .14); animation: rise .2s cubic-bezier(.2, .8, .2, 1); }
.entry.shake { animation: shake .32s linear; }
.entry.bracketing, .entry.bracketing .expr { touch-action: none; }
.entry .cap { font-size: 13px; color: var(--ink-2); margin: -4px 0 8px; display: flex; gap: 8px; align-items: center; }
.expr { min-height: 44px; padding-top: 12px; max-height: 132px; overflow-y: auto; font: 500 22px/2.15 var(--font-num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; cursor: text; }
.expr .ph { color: var(--ink-3); font: 500 20px/2.15 var(--font-ui); }
.tk { position: relative; display: inline-block; line-height: 1.3; padding: 2px 6px; margin: 0 1px; border-radius: 9px; white-space: nowrap; cursor: pointer; }
.tk.op { padding: 2px 4px; color: var(--ink-2); }
.tk.sym { font: italic 400 23px/1.3 var(--font-var); }
.tk.cur { background: var(--tint); color: var(--tint-ink); }
.tk.cur.op { color: var(--tint-ink); }
.tk.ghostb { background: var(--rule-2); color: var(--ink); }
.tk .lbl { position: absolute; left: 0; right: 0; bottom: 100%; text-align: center; font: italic 400 13px/1.1 var(--font-var); color: var(--ink-3); pointer-events: none; }
.tk.all { font: 600 15px/1.3 var(--font-ui); border: 1.5px solid var(--rule-2); border-radius: 12px; padding: 4px 9px; vertical-align: 2px; }
.tk.cur.all { border-color: var(--tint); }
.caret { display: inline-block; width: 2px; height: 1.15em; margin: 0 1px; background: var(--tint); vertical-align: -4px; animation: blink 1s steps(1) infinite; }
.res { margin-top: 2px; text-align: right; font: 700 34px/1.15 var(--font-num); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res.wait { color: var(--ink-3); }
.res.long { font-size: 26px; }
.res-note { min-height: 18px; text-align: right; font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.res-note.bad { color: var(--neg); }
.bar { display: flex; align-items: center; gap: 2px; height: 52px; padding: 0 6px; background: var(--sheet); border-top: 1px solid var(--rule); }
.bar.solo { height: calc(52px + var(--sab)); padding-bottom: var(--sab); }
.bar .ib { flex: 0 0 auto; width: 46px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--ink-2); font: 600 16px/1 var(--font-ui); }
.bar .ib:active:not(:disabled) { background: var(--paper); }
.bar .ib:disabled { opacity: .3; }
.bar .ib.mode { width: 54px; color: var(--tint); }
.bar .grow { flex: 1 1 auto; }
.pill { flex: 1 1 auto; min-width: 0; height: 38px; margin: 0 4px; padding: 0 16px; border-radius: 19px; border: 1.5px solid var(--rule-2); background: var(--sheet); color: var(--ink-3); text-align: center; font: 500 16px/1 var(--font-ui); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill.has { color: var(--ink); border-color: var(--tint); font-family: var(--font-num); }
.pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 8px 6px calc(8px + var(--sab)); }
.key { height: var(--key-h); min-width: 0; border-radius: 13px; background: var(--key); color: var(--ink); display: grid; place-items: center; font: 500 24px/1 var(--font-num); box-shadow: 0 1px 0 var(--key-edge); transition: transform .06s ease-out; touch-action: none; }
.key.util { background: var(--key-2); font-size: 21px; }
.key.word { font: 600 16px/1 var(--font-ui); }
.key.fx { font: italic 400 25px/1 var(--font-var); }
.key.clear { color: var(--neg); font-weight: 700; }
.key.enter { grid-column: span 2; background: var(--enter); color: var(--enter-ink); }
.key.wide2 { grid-column: span 2; }
.key.off { opacity: .3; box-shadow: none; cursor: default; }
.key.down { transform: scale(.95); filter: brightness(.9); }
.key.on { background: var(--tint); color: var(--tint-ink); }
.key svg.ic { width: 26px; height: 26px; }
.pad.abc { grid-template-columns: repeat(20, 1fr); gap: 5px 4px; --key-h: 42px; }
.pad.abc .key { grid-column: span 2; font: 500 21px/1 var(--font-ui); border-radius: 9px; }
.pad.abc .key.util { font-size: 19px; }
.pad.abc .key.s3 { grid-column: span 3; }
.pad.abc .key.s4 { grid-column: span 4; }
.pad.abc .key.s5 { grid-column: span 5; }
.pad.abc .key.s11 { grid-column: span 11; }
.pad.abc .key.shift2 { grid-column: 2 / span 2; }
.pad.abc .key svg.ic { width: 22px; height: 22px; }
.padnote { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: calc(var(--key-h) * 3); padding: 12px 10px; text-align: center; color: var(--ink-2); }
.padnote b { color: var(--ink); font-size: 18px; }
.padnote .acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

/* ------------------------------------------------------------ overlays */
.ovl { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 30; display: flex; flex-direction: column; justify-content: flex-end; }
.ovl.center { justify-content: flex-start; align-items: center; padding: calc(var(--sat) + 72px) 20px 0; }
.ovl-bg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: var(--scrim); opacity: 0; transition: opacity .2s ease-out; }
.ovl.open .ovl-bg { opacity: 1; }
.panel { position: relative; display: flex; flex-direction: column; max-height: calc(100% - var(--sat) - 18px); background: var(--sheet); border-radius: 22px 22px 0 0; padding-bottom: var(--sab); transform: translateY(102%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); box-shadow: var(--lift); }
.ovl.open .panel { transform: none; }
.panel.tall { height: calc(100% - var(--sat) - 18px); }
.panel-head { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 8px 6px 18px; min-height: 56px; }
.panel-title { flex: 1 1 auto; min-width: 0; margin: 0; font-size: 19px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 2px 16px 22px; }
.dlg { position: relative; width: 100%; max-width: 340px; background: var(--sheet); border-radius: 20px; padding: 20px 18px 14px; box-shadow: var(--lift); transform: scale(.96); opacity: 0; transition: transform .18s ease-out, opacity .18s ease-out; }
.ovl.open .dlg { transform: none; opacity: 1; }
.dlg h2 { margin: 0 0 6px; font-size: 19px; font-weight: 700; }
.dlg p { margin: 0 0 14px; color: var(--ink-2); font-size: 16px; line-height: 1.35; }
.dlg .acts { display: flex; gap: 8px; margin-top: 16px; }
.btn { flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 16px; border-radius: 14px; background: var(--paper); color: var(--ink); font-weight: 600; text-align: center; }
.btn.primary { background: var(--ink); color: var(--sheet); }
.btn.danger { background: var(--neg); color: var(--neg-ink); }
.btn:active { opacity: .82; }
.btn.block { width: 100%; flex: 0 0 auto; }

.group { margin: 16px 0 0; }
.group > h3 { margin: 0 2px 7px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.card { border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; background: var(--sheet); }
.line { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 7px 14px; border-bottom: 1px solid var(--rule); }
.line:last-child { border-bottom: 0; }
.line > .lab { flex: 1 1 auto; min-width: 0; }
.line > .lab small { display: block; color: var(--ink-2); font-size: 13.5px; line-height: 1.3; margin-top: 1px; }
.line.stack { flex-direction: column; align-items: stretch; gap: 7px; padding: 11px 14px 12px; }
.hint { margin: 7px 3px 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.35; }
.hint.bad { color: var(--neg); }
.inp { display: block; width: 100%; min-width: 0; height: 44px; padding: 0 12px; font-size: 17px; border: 1.5px solid var(--rule-2); border-radius: 11px; background: var(--sheet); color: var(--ink); -webkit-user-select: text; user-select: text; appearance: none; -webkit-appearance: none; }
textarea.inp { height: auto; min-height: 70px; padding: 10px 12px; resize: none; line-height: 1.3; }
.inp:focus { border-color: var(--tint); outline: none; }
.inp.short { width: 128px; flex: 0 0 auto; text-align: right; }
.inp.var { font: italic 400 19px/1 var(--font-var); }
.inp::placeholder { color: var(--ink-3); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button { min-width: 40px; height: 34px; padding: 0 10px; border-radius: 9px; background: var(--paper); color: var(--ink); font-size: 15px; text-align: center; }
.quick button:active { background: var(--tint-soft); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px; border-radius: 12px; background: var(--paper); }
.seg button { min-height: 38px; padding: 0 6px; border-radius: 9px; text-align: center; font-size: 15.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(18, 26, 23, .18); }
.step { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; }
.step button { width: 42px; height: 38px; border-radius: 10px; background: var(--paper); display: grid; place-items: center; font: 500 22px/1 var(--font-num); }
.step button:disabled { opacity: .35; }
.step output { min-width: 34px; text-align: center; font: 600 18px/1 var(--font-num); font-variant-numeric: tabular-nums; }
.switch { flex: 0 0 auto; position: relative; width: 52px; height: 32px; border-radius: 16px; background: var(--rule-2); transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--tint); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.menu button, .menu label { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 54px; padding: 6px 4px; border-bottom: 1px solid var(--rule); color: var(--ink); }
.menu button:last-child { border-bottom: 0; }
.menu button:active { background: var(--paper); }
.menu button.danger { color: var(--neg); }
.menu button > span { flex: 1 1 auto; min-width: 0; }
.menu button small { display: block; color: var(--ink-2); font-size: 13.5px; line-height: 1.3; }

    for (i = 0; i < list.length; i++) if (list[i] && typeof list[i].id === 'string') map[list[i].id] = uid('f');
    for (i = 0; i < list.length; i++) {

  }

  // ---------------------------------------------------------------- import and export

  function addImported(result) {

    result.sheets.forEach(function (sh) { state.sheets[sh.id] = sh; });
    if (result.backup) {
      var f = E.addFolder(state, 'Restored backup', folderId);

    return result.sheets.length === 1 && !result.backup ? result.sheets[0].id : null;
  }

  function importText(text, openAfter) {

    if (!r.ok) { toast(r.error); return false; }
    var id = addImported(r);

  }

  function pickImport() {
    var input = els.fileInput;
    input.value = '';

  }

  function copyText(text) {
    function fallback() {
      // read-only, so focusing it does not bring up the keyboard
      var ta = h('textarea', { 'aria-hidden': 'true', readonly: true, style: 'position:fixed;top:0;left:0;width:2px;height:2px;opacity:0' });
      ta.value = text;
      doc.body.appendChild(ta);
      ta.focus({ preventScroll: true }); ta.select();
      try { ta.setSelectionRange(0, text.length); } catch (e0) { /* select() was enough */ }
      var ok = false;
      try { ok = doc.execCommand('copy'); } catch (e) { ok = false; }
      doc.body.removeChild(ta);
      return ok;
    }
    if (root.navigator.clipboard && root.navigator.clipboard.writeText) {
      return root.navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallback(); });
    }
    return Promise.resolve(fallback());
  }

  function showCopyBox(title, text, note) {
    var box = h('textarea.copybox', { readonly: true, id: 'copybox', 'aria-label': title });
    box.value = text;
    var p = U.panel(title, [
      note ? h('p.hint', { text: note, style: 'margin:0 2px 10px' }) : null,
      box,
      h('div.group', null, h('button.btn.primary.block', { onclick: function () {
        copyText(text).then(function (ok) { if (ok) { toast('Copied'); p.close(); } else { box.focus(); box.select(); } });
      } }, icon('copy'), 'Copy'))
    ]);
  }

  function inViewer() { return !NATIVE && root.claude && typeof root.claude.use === 'function'; }

  function getDownloads() {
    if (!inViewer()) return Promise.resolve(null);
    if (!downloads) {
      try { downloads = root.claude.use('downloads'); } catch (e) { downloads = Promise.resolve(null); }
    }
    return Promise.race([downloads, new Promise(function (res) { setTimeout(function () { res(null); }, 3000); })]).catch(function () { return null; });
  }

  /* Hands a file to the person: the iOS share sheet in the app, a save prompt in the
     Claude viewer, and the share sheet or a download in an ordinary browser. */
  function deliver(name, mime, data, textFallback) {
    var bytes = typeof data === 'string' ? textToBytes(data) : data;
    if (NATIVE) { nativeSend({ type: 'share', filename: name, mime: mime, base64: bytesToB64(bytes) }); return; }
    getDownloads().then(function (dl) {
      if (dl) {
        return dl.save({ filename: name, data: new Blob([bytes], { type: mime }) }).then(function () { toast('Saved ' + name); }, function (err) {
          var code = err && err.code;
          if (code === 'declined') return;
          if (code === 'rate_limited') { toast('A save is already waiting for your answer.'); return; }
          fallback();
        });
      }
      if (inViewer()) { fallback(); return; }
      var blob = new Blob([bytes], { type: mime }), file = null;
      try { file = new File([blob], name, { type: mime }); } catch (e) { file = null; }
      var nav = root.navigator;
      if (file && nav.canShare && nav.share && /iPhone|iPad|Android/i.test(nav.userAgent) && nav.canShare({ files: [file] })) {
        nav.share({ files: [file], title: name }).catch(function () { /* cancelled */ });
        return;
      }
      var url = URL.createObjectURL(blob), a = h('a', { href: url, download: name, style: 'display:none' });
      doc.body.appendChild(a); a.click(); doc.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
      toast('Saved ' + name);
    });
    function fallback() {
      if (textFallback) showCopyBox(name, textFallback, 'Files can\u2019t be saved from this view, so here is the content to copy.');
      else toast('Files can\u2019t be saved from this view. The iPhone app opens the share sheet here.', { ms: 4200 });
    }
  }

  function pdfDoc(sh) {
    var res = E.computeSheet(sh, S()).byId, rows = [], formulas = [];
    sh.fields.forEach(function (f) {
      var d = E.displayField(f, res[f.id], S()), out = f.kind === 'output';
      var formula = out ? E.tokensToText(f.formula || [], sh, { settings: S() }) : '';
      rows.push({ symbol: f.symbol, label: f.desc || formula, ghost: !f.desc && out, prefix: d.prefix, value: d.state === 'ok' ? d.text : (out ? '?' : ''), suffix: d.suffix, result: out, negative: d.negative });

    var date;
    try { date = when.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) { date = when.toDateString(); }
    return { title: sh.name, note: date, rows: rows, formulas: formulas, showSymbols: S().showSymbols };
  }

  function paperSize() {
    var lang = (root.navigator.language || 'en-US');
    return /-(US|CA|MX|PH|CL|CO|VE|PR|GT|CR|PA|DO)$/i.test(lang) ? 'letter' : 'a4';
  }

  var FONT_CSS = {
    regular: function (px) { return '400 ' + px + 'px system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif'; },
    bold: function (px) { return '700 ' + px + 'px system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif'; },
    italic: function (px) { return 'italic 400 ' + px + 'px ui-serif, "New York", Georgia, "Times New Roman", serif'; }
  };
  function cssColor(c) { return 'rgb(' + Math.round(c[0] * 255) + ',' + Math.round(c[1] * 255) + ',' + Math.round(c[2] * 255) + ')'; }

  /* Draws the pages on canvases and stores them as images, for sheets whose text the
     standard PDF fonts cannot show (Chinese, Arabic, emoji and so on). */
  function pdfFromCanvas(d, paper) {
    var probe = doc.createElement('canvas').getContext('2d');
    function measure(text, font, size) { probe.font = FONT_CSS[font](size); return probe.measureText(text).width; }
    var lay = PDF.layout(d, { paper: paper }, measure), scale = 2, images = [];
    lay.pages.forEach(function (ops) {
      var c = doc.createElement('canvas');
      c.width = Math.round(lay.width * scale); c.height = Math.round(lay.height * scale);
      var g = c.getContext('2d');
      g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
      g.scale(scale, scale);
      g.textBaseline = 'alphabetic';
      ops.forEach(function (o) {
        if (o.op === 'rect') { g.fillStyle = cssColor(o.color); g.fillRect(o.x, o.y, o.w, o.h); }
        else if (o.op === 'line') { g.strokeStyle = cssColor(o.color); g.lineWidth = o.width; g.beginPath(); g.moveTo(o.x1, o.y1); g.lineTo(o.x2, o.y2); g.stroke(); }
        else if (o.op === 'text') { g.fillStyle = cssColor(o.color); g.font = FONT_CSS[o.font](o.size); g.fillText(o.text, o.x, o.y); }
      });
      var url = c.toDataURL('image/jpeg', 0.92), bin = root.atob(url.slice(url.indexOf(',') + 1)), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

  function buildPDF(sh) {

    if (!PDF.isPlain(d) && !PDF.canEncode(d.note)) {

      var now = new Date(), figures = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2) + '-' + ('0' + now.getDate()).slice(-2);
      var plain = {};

    return pdfFromCanvas(d, paper);
  }

  function sharePanel(onClose) {
    var sh = sheet();
    if (!sh) return;
    var p, list = h('div.menu');
    function act(fn) { return function () { p.close(); fn(); }; }
    list.appendChild(h('button', { onclick: act(function () {
      try { deliver(fileName(sh.name, '.pdf'), 'application/pdf', buildPDF(sh)); }
      catch (e) { toast('The PDF could not be made.'); }
    }) }, icon('pdf'), h('span', null, 'PDF', h('small', { text: 'A tidy page of the sheet, with the formulas listed.' }))));

  // ---------------------------------------------------------------- start-up

  function buildShell() {
    var app = doc.getElementById('app');
    clear(app);
    els.homeTop = h('header.top');
    els.homeHead = h('div.head');
    els.homeList = h('div.list', { id: 'home-list' });
    els.homeBar = h('footer.homebar', null,
      h('button.tbtn', { 'aria-label': 'Settings', onclick: settingsPanel }, icon('tune')),

      h('button.tbtn', { 'aria-label': 'New folder', onclick: newFolder }, icon('folderPlus')),

    els.home = h('section.screen', { id: 'home', 'aria-label': 'Sheets' }, els.homeTop, els.homeHead, els.homeList, els.homeBar);

    els.sheetTop = h('header.top');
    els.sheetHead = h('div.head');
    els.fields = h('div.fields', { id: 'fields' });
    els.scrim = h('div.scrim', { hidden: true, onclick: collapseEntry });
    els.entry = h('div.entry', { id: 'entry', hidden: true });
    els.bar = h('div.bar', { id: 'bar' });
    els.pad = h('div.pad', { id: 'pad' });
    els.dock = h('div.dock', null, els.entry, els.bar, els.pad);
    els.sheet = h('section.screen', { id: 'sheet', hidden: true, 'aria-label': 'Sheet' }, els.sheetTop, els.sheetHead,
      h('div.fields-wrap', null, els.fields, els.scrim), els.dock);

    els.fileInput = h('input', { type: 'file', id: 'file-input', accept: '.json,application/json,text/plain', hidden: true, 'aria-hidden': 'true', tabindex: '-1' });
    els.fileInput.addEventListener('change', function () {
      var file = els.fileInput.files && els.fileInput.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () { U.closeAll(); importText(String(reader.result || ''), els.sheet.hidden); };
      reader.onerror = function () { toast('That file could not be read.'); };
      reader.readAsText(file);
    });

    app.appendChild(els.home);
    app.appendChild(els.sheet);
    app.appendChild(h('div', { id: 'overlays' }));
    app.appendChild(h('div.toast', { id: 'toast' }));
    app.appendChild(els.fileInput);

    U.listGestures(els.homeList, {
      rowSel: '.item', mainSel: '.item-main',
      onTap: function (row) { if (!ui.homeEdit) openItem(row.getAttribute('data-id')); },
      onLong: function (row) { if (ui.homeEdit) return false; itemMenu(row.getAttribute('data-id')); return true; },
      onDelete: function (row) { deleteItem(row.getAttribute('data-id')); },
      canSwipe: function () { return !ui.homeEdit; }
    });
    U.reorder(els.homeList, { rowSel: '.item', handleSel: '.grip', onMove: function (from, to) {
      var list = currentItems(), it = list.splice(from, 1)[0];
      list.splice(to, 0, it);
      save(); renderHome();
    } });
    U.listGestures(els.fields, {
      rowSel: '.row', mainSel: '.row-main',
      onTap: rowTap, onDouble: rowDouble, onLong: rowLong, onDelete: rowDelete,
      canSwipe: function () { return !ui.editMode && !ui.link && !ui.entryOpen; }
    });
    U.reorder(els.fields, { rowSel: '.row', handleSel: '.grip', onMove: function (from, to) {
      if (E.moveField(sheet(), from, to)) { save(); renderFields(); }
    } });

    // Keypad. A key acts when the finger lifts while still on it, and every finger is followed
    // on its own: iOS sends no click at all when two taps overlap, which fast two-thumb typing
    // does all the time. Holding delete repeats it; holding ) opens the bracket helper.
    var presses = {}, lastPadPress = 0;
    function keyIsOff(b) { return b.classList.contains('off') || !els.pad.contains(b); }
    function endPress(id) {
      var p = presses[id];
      if (!p) return null;
      delete presses[id];
      clearTimeout(p.t); clearInterval(p.i);
      p.b.classList.remove('down');
      return p;
    }
    els.pad.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      endPress(e.pointerId);
      // a key that was taken away mid-press (the keys were swapped for something else) never reports its release
      for (var old in presses) if (!els.pad.contains(presses[old].b)) endPress(old);
      var b = e.target.closest('[data-k]');
      if (!b) return;
      var id = e.pointerId, k = b.getAttribute('data-k'), p = { b: b, held: false, t: null, i: null };

    els.pad.addEventListener('click', function (e) {

  function onKeyDown(e) {
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') { if (e.key === 'Escape') t.blur(); return; }
    if (e.key === 'Escape') {
      if (U.closeTop()) { e.preventDefault(); return; }
      if (ui.bracket) { ui.bracket = null; renderDock(); return; }
      if (ui.link) { endLink(); return; }
      if (ui.entryOpen) { collapseEntry(); return; }
      if (ui.sel) { deselect(); renderFields(); renderDock(); return; }
      return;
    }
    if (U.anyOpen() || e.metaKey || e.ctrlKey || e.altKey) return;
    if ((tag === 'BUTTON' || (t && t.getAttribute && t.getAttribute('role') === 'button')) && (e.key === 'Enter' || e.key === ' ')) {
      if (tag !== 'BUTTON') { e.preventDefault(); t.click(); }
      return;
    }
    if (els.sheet.hidden || ui.editMode || ui.link || ui.bracket) return;
    var k = null, key1 = e.key;
    if (key1 >= '0' && key1 <= '9' && key1.length === 1) k = 'd:' + key1;
    else if (key1 === '.' || key1 === ',') k = (key1 === ',' && E.editor.can(editorNow(), { k: 'sep' }) && !selMode()) ? 'sep' : 'dot';
    else if (key1 === '+') k = 'op:+';
    else if (key1 === '-') k = 'op:-';
    else if (key1 === '*') k = 'op:*';
    else if (key1 === '/') k = 'op:/';
    else if (key1 === '^') k = 'op:^';
    else if (key1 === '(') k = 'lp';
    else if (key1 === ')') k = 'rp';
    else if (key1 === '%') k = 'pct';
    else if (key1 === '!') { e.preventDefault(); edit({ k: 'fact' }); return; }
    else if (key1 === 'Enter' || key1 === '=') k = 'enter';
    else if (key1 === 'Backspace') k = 'back';
    else if (key1 === 'Delete') k = 'clear';
    else if (key1 === 'ArrowLeft' && ui.entryOpen) { e.preventDefault(); edit({ k: 'left' }); return; }
    else if (key1 === 'ArrowRight' && ui.entryOpen) { e.preventDefault(); edit({ k: 'right' }); return; }
    else if (/^[A-Za-z]$/.test(key1)) {
      e.preventDefault();
      if (ui.sel && !ui.entryOpen) { deselect(); renderFields(); }
      edit({ k: 'letter', ch: key1 });
      return;
    }
    if (k) { e.preventDefault(); key(k); }
  }

  /* Keeps the app inside the part of the screen the on-screen keyboard leaves free. In the
     iPhone app the web view itself is resized, so this only acts in a browser. */
  function fitViewport() {
    var vv = root.visualViewport, body = doc.body;
    if (!vv || !body) return;
    var covered = root.innerHeight - vv.height;
    if (covered > 80 && Math.abs((vv.scale || 1) - 1) < 0.01) {
      body.style.height = vv.height + 'px';
      body.style.transform = vv.offsetTop ? 'translateY(' + vv.offsetTop + 'px)' : '';
    } else if (body.style.height) {
      body.style.height = '';
      body.style.transform = '';
    }
  }

  /* After the keyboard has taken its share of the screen, the field being typed in may sit
     below the fold of its panel. Scroll the panel, and only the panel, to show it. */
  function revealFocused() {
    var el = doc.activeElement;
    if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA')) return;
    var box = el.closest('.panel-body');
    if (!box) return;
    var r = el.getBoundingClientRect(), b = box.getBoundingClientRect();
    if (r.bottom > b.bottom - 12) box.scrollTop += r.bottom - b.bottom + 28;
    else if (r.top < b.top + 8) box.scrollTop -= b.top - r.top + 16;
  }

  function boot() {
    hostTheme = doc.documentElement.getAttribute('data-theme');
    state = loadState();
    buildShell();
    applyTheme();
    // a browser scrolls to show a focused field even where scrolling is off; put it back
    var appEl = doc.getElementById('app');
    appEl.addEventListener('scroll', function () {
      if (appEl.scrollTop) appEl.scrollTop = 0;
      if (appEl.scrollLeft) appEl.scrollLeft = 0;

    if (root.visualViewport) {
      root.visualViewport.addEventListener('resize', function () { fitViewport(); setTimeout(revealFocused, 80); });
      root.visualViewport.addEventListener('scroll', fitViewport);
    }
    root.addEventListener('resize', function () { setTimeout(revealFocused, 80); });
    doc.addEventListener('focusin', function () { setTimeout(revealFocused, 420); });
    doc.addEventListener('focusout', function () { setTimeout(fitViewport, 350); });
    if (state.view.open && state.sheets[state.view.open]) openSheet(state.view.open);
    else { show('home'); renderHome(); }
    doc.addEventListener('keydown', onKeyDown);

    root.addEventListener('pagehide', flush);

      }

  /* Called by the iOS shell with the room the status bar and the home indicator need, in points.
